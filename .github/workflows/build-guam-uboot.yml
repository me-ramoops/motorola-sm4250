name: build guam u-boot

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-guam-uboot.yml
  workflow_run:
    workflows:
      - build guam kernel
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  uboot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio device-tree-compiler flex gcc-aarch64-linux-gnu libgnutls28-dev libssl-dev python3-dev python3-pyelftools python3-setuptools swig

      - name: build u-boot image
        run: |
          clone_retry() {
            repository=$1
            reference=$2
            destination=$3

            for attempt in 1 2 3; do
              attempt_destination="$destination-$attempt"
              if [ -n "$reference" ]; then
                if git clone --depth=1 --branch "$reference" "$repository" "$attempt_destination"; then
                  mv "$attempt_destination" "$destination"
                  return 0
                fi
              elif git clone --depth=1 "$repository" "$attempt_destination"; then
                mv "$attempt_destination" "$destination"
                return 0
              fi

              sleep 10
            done

            return 1
          }

          clone_retry https://gitlab.com/vanadium-oss/motorola-sm4250/mainline/u-boot.git guam "$RUNNER_TEMP/u-boot"
          clone_retry https://android.googlesource.com/platform/system/tools/mkbootimg "" "$RUNNER_TEMP/mkbootimg"
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output qcom_defconfig
          "$RUNNER_TEMP/u-boot/scripts/kconfig/merge_config.sh" -m -O "$RUNNER_TEMP/u-boot/.output" "$RUNNER_TEMP/u-boot/.output/.config" "$RUNNER_TEMP/u-boot/board/qualcomm/qcom-phone.config" "$RUNNER_TEMP/u-boot/board/qualcomm/guam.config"
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output olddefconfig
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output -j2
          dtb=$(find "$RUNNER_TEMP/u-boot/.output" -name sm4250-motorola-guam.dtb -print -quit)
          test -n "$dtb"
          gzip -n -c "$RUNNER_TEMP/u-boot/.output/u-boot-nodtb.bin" > u-boot-nodtb.bin.gz
          mkdir "$RUNNER_TEMP/guam-initramfs"
          cd "$RUNNER_TEMP/guam-initramfs"
          find . -print0 | cpio --null -o -H newc --quiet > "$RUNNER_TEMP/guam-initramfs.cpio"
          cd "$GITHUB_WORKSPACE"
          gzip -n -c "$RUNNER_TEMP/guam-initramfs.cpio" > u-boot-ramdisk.cpio.gz
          python3 "$RUNNER_TEMP/mkbootimg/mkbootimg.py" \
            --pagesize 4096 \
            --header_version 2 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x01f00000 \
            --cmdline 'console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x4a90000 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 loop.max_part=7 androidboot.hab.csv=4 androidboot.hab.product=guam androidboot.hab.cid=50 buildvariant=user' \
            --kernel u-boot-nodtb.bin.gz \
            --ramdisk u-boot-ramdisk.cpio.gz \
            --dtb "$dtb" \
            --output u-boot-motorola-guam.img
          cp "$dtb" sm4250-motorola-guam.dtb

      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-motorola-guam-${{ github.sha }}
          path: |
            u-boot-motorola-guam.img
            u-boot-nodtb.bin.gz
            sm4250-motorola-guam.dtb
          if-no-files-found: error
          retention-days: 14
