name: build guam u-boot

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: kernel build run id
        required: true
        type: string
      kernel_sha:
        description: kernel build commit
        required: true
        type: string
  workflow_run:
    workflows:
      - build guam kernel
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  uboot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_RUN_ID: ${{ github.event.workflow_run.id || inputs.kernel_run_id }}
      KERNEL_SHA: ${{ github.event.workflow_run.head_sha || inputs.kernel_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-nura-qcom-sm61x5-${{ env.KERNEL_SHA }}
          run-id: ${{ env.KERNEL_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu libgnutls28-dev libssl-dev python3-dev python3-pyelftools python3-setuptools swig

      - name: build u-boot image
        run: |
          mkdir kernel-package
          tar -xzf linux-nura-qcom-sm61x5-*.apk -C kernel-package
          dtb=$(find kernel-package -name sm4250-motorola-guam.dtb -print -quit)
          test -n "$dtb"
          clone_retry() {
            repository=$1
            reference=$2
            destination=$3

            for attempt in 1 2 3; do
              attempt_destination="$destination-$attempt"
              if [ -n "$reference" ]; then
                if git clone --depth=1 --branch "$reference" "$repository" "$attempt_destination"; then
                  mv "$attempt_destination" "$destination"
                  return 0
                fi
              elif git clone --depth=1 "$repository" "$attempt_destination"; then
                mv "$attempt_destination" "$destination"
                return 0
              fi

              sleep 10
            done

            return 1
          }

          clone_retry https://gitlab.com/vanadium-oss/motorola-sm4250/mainline/u-boot.git guam "$RUNNER_TEMP/u-boot"
          clone_retry https://android.googlesource.com/platform/system/tools/mkbootimg "" "$RUNNER_TEMP/mkbootimg"
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output qcom_defconfig
          "$RUNNER_TEMP/u-boot/scripts/kconfig/merge_config.sh" -m -O "$RUNNER_TEMP/u-boot/.output" "$RUNNER_TEMP/u-boot/.output/.config" "$RUNNER_TEMP/u-boot/board/qualcomm/qcom-phone.config" "$RUNNER_TEMP/u-boot/board/qualcomm/guam.config"
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output olddefconfig
          make -C "$RUNNER_TEMP/u-boot" CROSS_COMPILE=aarch64-linux-gnu- O=.output -j2
          gzip -n -c "$RUNNER_TEMP/u-boot/.output/u-boot-nodtb.bin" > u-boot-nodtb.bin.gz
          python3 "$RUNNER_TEMP/mkbootimg/mkbootimg.py" \
            --pagesize 4096 \
            --header_version 2 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x01f00000 \
            --kernel u-boot-nodtb.bin.gz \
            --dtb "$dtb" \
            --output u-boot-motorola-guam.img
          cp "$dtb" sm4250-motorola-guam.dtb

      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-motorola-guam-${{ env.KERNEL_SHA }}
          path: |
            u-boot-motorola-guam.img
            u-boot-nodtb.bin.gz
            sm4250-motorola-guam.dtb
          if-no-files-found: error
          retention-days: 14
