name: build guam kernel

on:
  workflow_dispatch:
  push:
    paths:
      - device/testing/linux-nura-qcom-sm61x5/**
      - device/testing/device-motorola-guam/**
      - .github/workflows/build-guam-kernel.yml

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: add upstream pmaports remote
        run: |
          git remote add pmaports https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch --depth=1 pmaports main

      - name: install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kpartx

      - name: install pmbootstrap
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"

      - name: prepare pmbootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/pmbootstrap-work"
          printf '8\n' > "$RUNNER_TEMP/pmbootstrap-work/version"
          cat > "$RUNNER_TEMP/pmbootstrap.cfg" <<EOF
          [pmbootstrap]
          work = $RUNNER_TEMP/pmbootstrap-work
          aports = $GITHUB_WORKSPACE
          device = motorola-guam
          kernel = nura-qcom-sm61x5
          EOF

      - name: build kernel package
        run: |
          pmb() {
            python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
              --config "$RUNNER_TEMP/pmbootstrap.cfg" \
              --work "$RUNNER_TEMP/pmbootstrap-work" \
              --aports "$GITHUB_WORKSPACE" \
              "$@"
          }

          pmb build_init
          pmb build --arch aarch64 linux-nura-qcom-sm61x5 || {
            tail -n 300 "$RUNNER_TEMP/pmbootstrap-work/log.txt"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-nura-qcom-sm61x5-${{ github.sha }}
          path: ${{ runner.temp }}/pmbootstrap-work/packages/edge/aarch64/linux-nura-qcom-sm61x5-*.apk
          if-no-files-found: error
          retention-days: 14
