name: build guam kernel

on:
  workflow_dispatch:
  push:
    paths:
      - device/testing/linux-nura-qcom-sm61x5/**
      - device/testing/device-motorola-guam/**
      - device/testing/firmware-motorola-guam/**
      - .github/workflows/build-guam-kernel.yml

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: add upstream pmaports remote
        run: |
          git remote add pmaports https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch --depth=1 pmaports main

      - name: install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kpartx zstd

      - name: install pmbootstrap
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"

      - name: prepare pmbootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/pmbootstrap-work"
          printf '8\n' > "$RUNNER_TEMP/pmbootstrap-work/version"
          cat > "$RUNNER_TEMP/pmbootstrap.cfg" <<EOF
          [pmbootstrap]
          work = $RUNNER_TEMP/pmbootstrap-work
          aports = $GITHUB_WORKSPACE
          device = motorola-guam
          kernel = nura-qcom-sm61x5
          ui = gnome-mobile
          EOF

      - name: build kernel package
        run: |
          pmb() {
            python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
              --config "$RUNNER_TEMP/pmbootstrap.cfg" \
              --work "$RUNNER_TEMP/pmbootstrap-work" \
              --aports "$GITHUB_WORKSPACE" \
              "$@"
          }

          pmb build_init
          mkdir -p "$RUNNER_TEMP/pmbootstrap-work/cache_distfiles"
          curl --fail --location --retry 3 --retry-delay 5 \
            https://codeberg.org/sm61x5-mainline/linux/archive/v7.2.3-r0.tar.gz \
            --output "$RUNNER_TEMP/linux-nura-qcom-sm61x5-v7.2.3-r0.tar.gz"
          sudo install -m 0644 \
            "$RUNNER_TEMP/linux-nura-qcom-sm61x5-v7.2.3-r0.tar.gz" \
            "$RUNNER_TEMP/pmbootstrap-work/cache_distfiles/linux-nura-qcom-sm61x5-v7.2.3-r0.tar.gz"
          pmb build --arch aarch64 linux-nura-qcom-sm61x5 || {
            python3 - "$RUNNER_TEMP/pmbootstrap-work/log.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pattern = re.compile(r"fatal error:|error:|undefined reference|no space left|out of memory|killed|segmentation fault|make(?:\[\d+\])?: \*\*\*", re.IGNORECASE)
          matches = [(index, line) for index, line in enumerate(lines) if pattern.search(line)]
          if matches:
              for index, line in matches[-200:]:
                  print(f"{index + 1}: {line}")
          else:
              print("\n".join(lines[-2000:]))
          PY
            exit 1
          }

      - name: upload failed kernel build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-nura-qcom-sm61x5-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/pmbootstrap-work/log.txt
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-nura-qcom-sm61x5-${{ github.sha }}
          path: ${{ runner.temp }}/pmbootstrap-work/packages/edge/aarch64/linux-nura-qcom-sm61x5-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: build guam image
        env:
          PMOS_TEST_PASSWORD: ${{ secrets.PMOS_TEST_PASSWORD }}
        run: |
          if [ -z "$PMOS_TEST_PASSWORD" ]; then
            echo "PMOS_TEST_PASSWORD secret is required" >&2
            exit 1
          fi
          pmb() {
            python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
              --config "$RUNNER_TEMP/pmbootstrap.cfg" \
              --work "$RUNNER_TEMP/pmbootstrap-work" \
              --aports "$GITHUB_WORKSPACE" \
              "$@"
          }

          pmb build --arch aarch64 firmware-motorola-guam device-motorola-guam
          pmb install --password "$PMOS_TEST_PASSWORD" --filesystem ext4 --sparse
          pmb export "$RUNNER_TEMP/guam-export"
          file "$RUNNER_TEMP/guam-export/motorola-guam.img" | grep -qi "android sparse image"
          mkdir guam-image
          cp -L "$RUNNER_TEMP/guam-export/boot.img" guam-image/boot.img
          zstd -3 -T2 -c < "$RUNNER_TEMP/guam-export/motorola-guam.img" > guam-image/motorola-guam.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: pmos-motorola-guam-${{ github.sha }}
          path: guam-image/*
          if-no-files-found: error
          retention-days: 14
